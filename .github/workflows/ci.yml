name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layout, naming and public-boundary tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  lab-context-distillation-wx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/lab-context-distillation-wx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bytecode compilation
        run: python3 -m compileall -q scripts
      - name: Frozen contract bundle
        run: python3 scripts/pcd.py contract-validate contracts/real-distillation-v2

  lab-ontology:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: lab-ontology/vault/ops/gateway/package-lock.json
      - name: Configure the isolated Vault path
        run: echo "VAULT_DIR=$RUNNER_TEMP/lab-ontology-vault" >> "$GITHUB_ENV"
      - name: Create an independent Git Vault fixture
        run: |
          mkdir -p "$VAULT_DIR"
          cp -a lab-ontology/vault/. "$VAULT_DIR/"
          git -C "$VAULT_DIR" init
          git -C "$VAULT_DIR" config user.name "CI Fixture"
          git -C "$VAULT_DIR" config user.email "ci-fixture@example.invalid"
          git -C "$VAULT_DIR" add -A
          git -C "$VAULT_DIR" commit -m "Initialize synthetic knowledge vault"
      - name: Install pinned gateway dependencies
        run: npm --prefix "$VAULT_DIR/ops/gateway" ci
      - name: Full deterministic gateway unit suite
        run: npm --prefix "$VAULT_DIR/ops/gateway" run test:unit
      - name: Canonical schema validation
        run: npm --prefix "$VAULT_DIR/ops/gateway" run validate:schema
      - name: Vault validation
        run: node "$VAULT_DIR/ops/validate-vault.mjs"
      - name: Gateway boots with the exact 13-tool surface
        run: |
          export AGENT_KNOWLEDGE_STATE_DIR="$RUNNER_TEMP/agent-knowledge-ci"
          cd "$VAULT_DIR/ops/gateway"
          node --input-type=module -e '
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";
            const expected = [
              "knowledge_apply_proposal",
              "knowledge_get",
              "knowledge_get_proposal",
              "knowledge_intake",
              "knowledge_list",
              "knowledge_list_proposals",
              "knowledge_propose_changes",
              "knowledge_reject_proposal",
              "knowledge_related",
              "knowledge_repair_index",
              "knowledge_route",
              "knowledge_schema",
              "knowledge_search",
            ];
            const transport = new StdioClientTransport({
              command: process.execPath,
              args: ["server.mjs"],
              env: { ...process.env, AGENT_KNOWLEDGE_STATE_DIR: process.env.AGENT_KNOWLEDGE_STATE_DIR },
            });
            const client = new Client({ name: "ci-probe", version: "0" });
            await client.connect(transport);
            const { tools } = await client.listTools();
            const names = tools.map((t) => t.name).sort();
            console.log(names.join("\n"));
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              throw new Error(`unexpected tool set: ${JSON.stringify(names)}`);
            }
            await client.close();
          '
      - name: Generated navigation and runtime state do not dirty the Vault
        run: test -z "$(git -C "$VAULT_DIR" status --porcelain)"

  lab-trust-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    defaults:
      run:
        working-directory: lab-trust-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: lab-trust-core/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify SDK, CLI, MCP, privacy and package
        run: npm run verify
