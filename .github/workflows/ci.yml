name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layout, naming and public-boundary tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  lab-context-distillation-wx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/lab-context-distillation-wx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bytecode compilation
        run: python3 -m compileall -q scripts
      - name: Frozen contract bundle
        run: python3 scripts/pcd.py contract-validate contracts/real-distillation-v2

  lab-ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab-ontology/vault/ops/gateway/package-lock.json
      - name: Vault validator on the shipped skeleton
        working-directory: lab-ontology/vault
        run: node ops/validate-vault.mjs
      - name: Install gateway dependencies
        working-directory: lab-ontology/vault/ops/gateway
        run: npm ci
      - name: Router unit tests
        working-directory: lab-ontology/vault/ops/gateway
        run: npm run test:router
      - name: Gateway boots and lists all 13 tools (no GBrain required)
        working-directory: lab-ontology/vault/ops/gateway
        run: |
          node --input-type=module -e '
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";
            const transport = new StdioClientTransport({ command: process.execPath, args: ["server.mjs"] });
            const client = new Client({ name: "ci-probe", version: "0" });
            await client.connect(transport);
            const { tools } = await client.listTools();
            const names = tools.map((t) => t.name).sort();
            console.log(names.join("\n"));
            if (names.length !== 13 || !names.every((n) => n.startsWith("knowledge_"))) {
              throw new Error(`unexpected tool set: ${names.length}`);
            }
            await client.close();
          '
